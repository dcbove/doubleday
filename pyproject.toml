[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doubleday"
version = "0.1.0"
description = "Analysis and processing of pitch-by-pitch MLB data"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Your Name" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
doubleday = "doubleday.main:main"

[tool.black]
line-length = 88
target-version = ['py312']

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[dependency-groups]
dev = [
    "black>=25.11.0",
    "mypy>=1.18.2",
    "pytest>=9.0.0",
    "ruff>=0.14.4",
]
