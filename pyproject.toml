[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doubleday"
version = "0.1.0"
description = "Analysis and processing of pitch-by-pitch MLB data"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Daniel Bove" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "boto3>=1.35.0",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
    "stripe>=12.0.0",
]

[project.scripts]
doubleday = "doubleday.main:main"

[tool.black]
line-length = 119
target-version = ['py312']

[tool.ruff]
line-length = 119
target-version = "py312"

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
markers = [
    "integration: tests that call real AWS services",
]
filterwarnings = [
    "ignore:No application metrics to publish:UserWarning",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[dependency-groups]
dev = [
    "aws-lambda-powertools>=3.0.0",
    "black>=25.11.0",
    "boto3-stubs[athena]>=1.35.0",
    "mypy>=1.18.2",
    "pytest>=9.0.0",
    "requests>=2.31.0",
    "ruff>=0.14.4",
    "types-requests>=2.31.0",
]
