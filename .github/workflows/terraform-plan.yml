name: Terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - "src/**"
      - "sql/**"
      - "frontend/**"
      - "scripts/**"
      - "bazel/**"
      - "MODULE.bazel"
      - ".bazelrc"
      - "**/BUILD.bazel"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  apply-oidc:
    name: Apply (oidc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform Init
        working-directory: terraform/environments/oidc
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform/environments/oidc
        run: terraform apply -auto-approve

  apply-dev:
    name: Apply (dev)
    needs: apply-oidc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Build Lambda packages
        run: |
          bazel build //src/doubleday/...
          ./scripts/copy_lambda_zips.sh

      - name: Terraform Init
        working-directory: terraform/environments/dev
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform/environments/dev
        run: terraform apply -auto-approve

      - name: Get Terraform outputs
        id: tf
        working-directory: terraform/environments/dev
        run: |
          echo "bucket=$(terraform output -raw frontend_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "cognito_pool_id=$(terraform output -raw cognito_user_pool_id)" >> "$GITHUB_OUTPUT"
          echo "cognito_client_id=$(terraform output -raw cognito_client_id)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          EXPO_PUBLIC_COGNITO_USER_POOL_ID: ${{ steps.tf.outputs.cognito_pool_id }}
          EXPO_PUBLIC_COGNITO_CLIENT_ID: ${{ steps.tf.outputs.cognito_client_id }}
          EXPO_PUBLIC_COGNITO_DOMAIN: doubleday-dev
          EXPO_PUBLIC_COGNITO_REGION: us-east-1
          EXPO_PUBLIC_REDIRECT_SIGN_IN: https://doubleday-dev.appleforge.com/callback
          EXPO_PUBLIC_REDIRECT_SIGN_OUT: https://doubleday-dev.appleforge.com
        run: npx expo export --platform web

      - name: Deploy frontend to S3
        run: aws s3 sync frontend/dist "s3://${{ steps.tf.outputs.bucket }}" --delete --exclude "static/*"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "${{ steps.tf.outputs.distribution_id }}" --paths "/*"

  plan-prod:
    name: Plan (prod)
    needs: apply-oidc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Build Lambda packages
        run: |
          bazel build //src/doubleday/...
          ./scripts/copy_lambda_zips.sh

      - name: Terraform Init
        working-directory: terraform/environments/prod
        run: terraform init

      - name: Terraform Plan
        id: plan
        working-directory: terraform/environments/prod
        run: terraform plan -no-color -out=tfplan 2>&1 | tee plan-output.txt
        continue-on-error: true

      - name: Post plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/environments/prod/plan-output.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n\n... (truncated)'
              : plan;

            const body = `### Terraform Plan — \`prod\`

            \`\`\`
            ${truncated}
            \`\`\`

            *Triggered by @${context.actor} in #${context.issue.number}*`;

            // Find and delete previous comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(`Terraform Plan — \`prod\``)
            );
            if (existing) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
              });
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });

      - name: Fail on plan error
        if: steps.plan.outcome == 'failure'
        run: exit 1
