name: Terraform

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "src/**"
      - "sql/**"
      - "frontend/**"

permissions:
  id-token: write
  contents: read

jobs:
  apply-oidc:
    name: Apply (oidc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform Init
        working-directory: terraform/environments/oidc
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform/environments/oidc
        run: terraform apply -auto-approve

  apply-prod:
    name: Apply (prod)
    needs: apply-oidc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Build Lambda package
        run: ./scripts/build_lambda_package.sh

      - name: Terraform Init
        working-directory: terraform/environments/prod
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform/environments/prod
        run: terraform apply -auto-approve

      - name: Get Terraform outputs
        id: tf
        working-directory: terraform/environments/prod
        run: |
          echo "bucket=$(terraform output -raw frontend_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "cognito_pool_id=$(terraform output -raw cognito_user_pool_id)" >> "$GITHUB_OUTPUT"
          echo "cognito_client_id=$(terraform output -raw cognito_client_id)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          EXPO_PUBLIC_COGNITO_USER_POOL_ID: ${{ steps.tf.outputs.cognito_pool_id }}
          EXPO_PUBLIC_COGNITO_CLIENT_ID: ${{ steps.tf.outputs.cognito_client_id }}
          EXPO_PUBLIC_COGNITO_DOMAIN: doubleday-prod
          EXPO_PUBLIC_COGNITO_REGION: us-east-1
          EXPO_PUBLIC_REDIRECT_SIGN_IN: https://doubleday.appleforge.com/callback
          EXPO_PUBLIC_REDIRECT_SIGN_OUT: https://doubleday.appleforge.com
        run: npx expo export --platform web

      - name: Deploy frontend to S3
        run: aws s3 sync frontend/dist "s3://${{ steps.tf.outputs.bucket }}" --delete --exclude "static/*"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "${{ steps.tf.outputs.distribution_id }}" --paths "/*"
